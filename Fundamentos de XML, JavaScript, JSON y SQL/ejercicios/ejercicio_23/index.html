<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Ejercicio 22</title>
</head>

<body>
  <!-- EJERCICIO 1 -->
  <h2>Ejercicio 1</h2>
  <h3>Aplicar IVA a productos</h3>

  <form id="checkNumbersForm">
    <input type="number" id="num1" placeholder="Introduce número 1" required>
    <input type="number" id="num2" placeholder="Introduce número 2" required>
    <input type="number" id="num3" placeholder="Introduce número 3" required>
    <input type="number" id="num4" placeholder="Introduce número 4" required>
    <input type="number" id="num5" placeholder="Introduce número 5" required>

    <button id="checkNumbersBtn">Comprobar números</button>
  </form>

  <!-- Contenedor para resultado -->
  <div id="resultadoNumeros"></div>

  <!-- EJERCICIO 2 -->
  <h2>Ejercicio 2</h2>
  <h3>Crear cadena de caracteres ingresando posiciones</h3>

  <form id="numIndexForm">
    <input type="number" id="numIndex" placeholder="Introduce un número (posición)" required>

    <button id="addNumIndexBtn">Ingresar posición</button>
  </form>

  <!-- Contenedor para resultado -->
  <div id="resultadoCadena"></div>

  <!-- EJERCICIO 3 -->
  <h2>Ejercicio 3</h2>
  <h3>Contar vocales de una frase</h3>

  <form id="analyzePhraseForm">
    <input type="text" id="phraseInput" placeholder="Introduce una frase" required>
    <button id="analyzePhraseBtn">Contar vocales</button>
  </form>

  <!-- Contenedor para resultado -->
  <div id="vowelCountResult"></div>

  <!-- EJERCICIO 4 -->
  <h2>Ejercicio 4</h2>
  <h3>Mostrar notas de examen</h3>

  <form id="examNotesForm">
    <input type="text" id="studentNameInput" placeholder="Introduce nombre de alumno" required>

    <button id="queryNoteBtn">Consultar nota</button>
  </form>

  <!-- Contenedor para resultado -->
  <div id="examNoteResult"></div>

  <!-- EJERCICIO 5 -->
  <h2>Ejercicio 5</h2>
  <h3>Comprobar número capicua</h3>

  <form id="numCapicuaForm">
    <input type="number" id="numCapicuaInput" placeholder="Introduce un número" required>
    <button id="numCapicuaBtn">Comprobar número</button>
  </form>

  <!-- Contenedor para resultado -->
  <div id="numCapicuaResult"></div>

  <script src="./ejer01.js"></script>
  <script src="./ejer02.js"></script>
  <script src="./ejer03.js"></script>
  <script src="./ejer04.js"></script>
  <script src="./ejer05.js"></script>
</body>

</html>
