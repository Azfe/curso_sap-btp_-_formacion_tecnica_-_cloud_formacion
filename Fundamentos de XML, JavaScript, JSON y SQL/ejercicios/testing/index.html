  <h3>Descomponer número en dígitos y sumarlos</h3>

  <form id="checkNumberForm">

    <button id="Button">Calcular</button>
  </form>

  <!-- Contenedor para resultado -->
  <div id="resultadoNumero"></div>

  <form id="countDownForm">

    <button id="Button">Cuenta atrás</button>
  </form>

  <!-- Contenedor para resultado -->
  <div id="resultadoCountDown"></div>
