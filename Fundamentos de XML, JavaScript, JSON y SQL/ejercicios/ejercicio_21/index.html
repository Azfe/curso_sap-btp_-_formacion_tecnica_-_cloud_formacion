<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ejercicio 21</title>
</head>
<body>
  <!-- EJERCICIO 1 -->
  <h2>Ejercicio 1</h2>
  <h3>Descomponer número en dígitos y sumarlos</h3>

  <form id="checkNumberForm">
    <input type="number" id="num" placeholder="Introduce un número" required>

    <button id="Button">Calcular</button>
  </form>

  <!-- Contenedor para resultado -->
  <div id="resultadoNumero"></div>
  
  <!-- EJERCICIO 2 -->
  <h2>Ejercicio 2</h2>
  <h3>Cuenta atrás</h3>

  <form id="countDownForm">
    <input type="number" id="numCountDown" placeholder="Introduce un número" required>

    <button id="Button">Cuenta atrás</button>
  </form>

  <!-- Contenedor para resultado -->
  <div id="resultadoCountDown"></div>

  <!-- EJERCICIO 3 -->
  <h2>Ejercicio 3</h2>
  <h3>Edad en años</h3>
  <!-- Contenedor para resultado -->
  <div id="resultadoAnyoEdad"></div>

  <!-- EJERCICIO 4 -->
  <h2>Ejercicio 4</h2>
  <h3>Invertir texto</h3>

  <form id="reversedTextForm">
    <input type="text" id="textToBeReversed" placeholder="Introduce un texto" required>

    <button id="Button">Invertir texto</button>
  </form>

  <!-- Contenedor para resultado -->
  <div id="resultadoReversedText"></div>

  <!-- EJERCICIO 5 -->
  <h2>Ejercicio 5</h2>
  <h3>Calcular inversión</h3>

  <form id="calcularInversiontForm">
    <input type="text" id="cantidadInversion" placeholder="Introduce cantidad a invertir" required>
    <input type="text" id="interesAnual" placeholder="Introduce interés anual" required>
    <input type="text" id="numAniosInversion" placeholder="Introduce número de años" required>

    <button id="Button">Calcular inversión</button>
  </form>

  <!-- Contenedor para resultado -->
  <div id="resultadoCalcularInversion"></div>

  <!-- EJERCICIO 6 -->
  <h2>Ejercicio 6</h2>
  <h3>Crear triángulo de números</h3>

  <form id="calcularInversiontForm">
    <input type="number" id="numCountDown" placeholder="Introduce un número" required>
    <button id="Button">Calcular inversión</button>
  </form>

  <!-- Contenedor para resultado -->
  <div id="resultadoCalcularInversion"></div>

  <script src="./ejer02.js"></script>
  <script src="./ejer03.js"></script>
  <script src="./ejer04.js"></script>
  <script src="./ejer05.js"></script>
  <script src="./ejer06.js"></script>
</body>
</html>
