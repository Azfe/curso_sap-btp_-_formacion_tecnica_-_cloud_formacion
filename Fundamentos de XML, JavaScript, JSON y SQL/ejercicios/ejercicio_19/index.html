<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ejercicio 19</title>
</head>
<body>
  <h2>Ejercicio 1</h2>
  <h3>Solicitud de números:</h3>
  <form id="numerosForm">
    <label for="numero1">Número 1:</label>
    <input type="number" id="num1" required><br><br>

    <label for="numero2">Número 2:</label>
    <input type="number" id="num2" required><br><br>

    <label for="numero3">Número 3:</label>
    <input type="number" id="num3" required><br><br>

    <button type="submit">Calcular</button>
  </form>

  <!-- Contenedor para el resultado -->
  <div id="resultado"></div>

  <h2>Ejercicio 2</h2>
  <h3>Solicitud de nombre:</h3>

  <form id="nameForm">
    <label for="nombre">Nombre:</label>
    <input type="text" id="name" required><br><br>
    <button type="submit">Enviar</button>
  </form>

  <!-- Contenedor para letra nombre -->
  <div id="resultadoNombre"></div>
  
  <script src="./app.js"></script>
  <script src="./app2.js"></script>  
</body>
</html>
